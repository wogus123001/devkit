<!doctype html>
<!-- Source for public/og.png (1200x630). Regenerate with headless Chrome:
     chrome --headless=new --hide-scrollbars --window-size=1200,630 --screenshot=public/og.png scripts/og.html -->

<html lang="ko">
<head>
<meta charset="UTF-8" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
    background: #0d1117;
    background-image: radial-gradient(circle at 85% 15%, rgb(15 118 110 / 45%), transparent 45%), radial-gradient(circle at 10% 100%, rgb(15 118 110 / 25%), transparent 40%);
    color: #e6edf3;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 96px; box-sizing: border-box;
  }
  .brand { display: flex; align-items: center; gap: 22px; }
  .logo { width: 96px; height: 96px; }
  .name { font-size: 76px; font-weight: 800; letter-spacing: -0.02em; }
  h1 { font-size: 54px; font-weight: 700; margin: 40px 0 18px; letter-spacing: -0.02em; }
  .tags { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 44px; }
  .tag { font: 600 26px 'Cascadia Code', Consolas, monospace; color: #5eead4; background: rgb(94 234 212 / 10%); border: 1px solid rgb(94 234 212 / 30%); border-radius: 10px; padding: 8px 16px; }
  .foot { font-size: 28px; color: #9aa4b2; display: flex; gap: 18px; }
  .foot b { color: #e6edf3; font-weight: 600; }
</style>
</head>
<body>
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#0f766e"/><path d="M11 10l-5 6 5 6M21 10l5 6-5 6M18 8l-4 16" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="name">DevKit</div>
  </div>
  <h1>개발자 도구 60개, 한곳에</h1>
  <div class="tags">
    <span class="tag">Base64</span><span class="tag">JSON</span><span class="tag">JWT</span><span class="tag">정규식</span><span class="tag">YAML</span><span class="tag">SQL</span><span class="tag">해시</span><span class="tag">UUID</span>
  </div>
  <div class="foot"><b>입력값은 브라우저 밖으로 나가지 않습니다</b><span>·</span><span>설치 없이 무료</span></div>
</body>
</html>
